
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پیوند | چت همکاران</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #eef7f1;
      min-height: 100vh;
    }

    .app {
      max-width: 1100px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,.08);
    }

    /* ستون کاربران */
    .sidebar {
      width: 320px;
      background: #f6faf7;
      border-left: 1px solid #e1ebe4;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      height: 75px;
      background: #2f8f5b;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
    }

    .mini-logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: rgba(255,255,255,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      font-weight: bold;
    }

    .sidebar-title {
      font-size: 20px;
      font-weight: bold;
    }

    .search {
      padding: 15px;
      border-bottom: 1px solid #e5eee8;
    }

    .search input {
      width: 100%;
      height: 43px;
      border: none;
      border-radius: 12px;
      background: white;
      padding: 0 14px;
      outline: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .room {
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid #edf2ee;
    }

    .room:hover {
      background: #eaf5ee;
    }

    .room-icon {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: #dff1e6;
      color: #2f8f5b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .room-info {
      flex: 1;
    }

    .room-name {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .room-last {
      color: #87958d;
      font-size: 12px;
    }

    /* چت */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      height: 75px;
      border-bottom: 1px solid #e5ebe7;
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 13px;
    }

    .chat-avatar {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: #dff1e6;
      color: #2f8f5b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
    }

    .chat-title {
      font-weight: bold;
      font-size: 17px;
    }

    .online {
      color: #2f8f5b;
      font-size: 11px;
      margin-top: 4px;
    }

    .messages {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      background:
        radial-gradient(#e5f0e8 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .welcome {
      text-align: center;
      margin: 30px auto;
      max-width: 430px;
      background: rgba(255,255,255,.92);
      padding: 20px;
      border-radius: 18px;
      color: #728078;
      font-size: 13px;
      line-height: 2;
      box-shadow: 0 4px 15px rgba(0,0,0,.04);
    }

    .message {
      display: flex;
      margin-bottom: 14px;
    }

    .message.me {
      justify-content: flex-start;
    }

    .message.other {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 70%;
      padding: 11px 15px;
      border-radius: 17px;
      font-size: 14px;
      line-height: 1.8;
    }

    .me .bubble {
      background: #dff1e6;
      color: #244d35;
      border-bottom-right-radius: 5px;
    }

    .other .bubble {
      background: white;
      color: #39463f;
      border: 1px solid #e5ece7;
      border-bottom-left-radius: 5px;
    }

    /* ارسال پیام */
    .composer {
      min-height: 75px;
      border-top: 1px solid #e5ebe7;
      padding: 12px 18px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: white;
    }

    .composer input {
      flex: 1;
      height: 50px;
      border: 1px solid #dfe9e2;
      border-radius: 15px;
      padding: 0 16px;
      outline: none;
      font-size: 14px;
      background: #f8fbf9;
    }

    .composer input:focus {
      border-color: #58a975;
      background: white;
    }

    .send {
      width: 52px;
      height: 50px;
      border: none;
      border-radius: 15px;
      background: #2f8f5b;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .send:hover {
      background: #26784b;
    }

    @media(max-width: 700px) {

      .sidebar {
        display: none;
      }

      .app {
        width: 100%;
      }

      .bubble {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- کاربران و اتاق‌ها -->
  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="mini-logo">پ</div>
      <div class="sidebar-title">پیوند</div>
    </div>

    <div class="search">
      <input
        type="text"
        placeholder="جستجوی همکار یا گفتگو...">
    </div>

    <div class="room">

      <div class="room-icon">👥</div>

      <div class="room-info">
        <div class="room-name">
          گفتگوی همکاران
        </div>

        <div class="room-last">
          محیط عمومی همکاران
        </div>
      </div>

    </div>

  </aside>


  <!-- محیط چت -->
  <main class="chat">

    <header class="chat-header">

      <div class="chat-avatar">
        👥
      </div>

      <div>
        <div class="chat-title">
          گفتگوی همکاران
        </div>

        <div class="online">
          ● محیط اختصاصی پیوند
        </div>
      </div>

    </header>


    <section class="messages" id="messages">

      <div class="welcome">
        <strong>به پیوند خوش آمدید 🌱</strong>
        <br>
        اینجا محیط ارتباطی اختصاصی همکاران است.
        <br>
        پیام خود را از پایین صفحه ارسال کنید.
      </div>

    </section>


    <div class="composer">

      <input
        id="messageInput"
        type="text"
        placeholder="پیام خود را بنویسید..."
        onkeydown="if(event.key==='Enter') sendMessage()">

      <button class="send" onclick="sendMessage()">
        ➤
      </button>

    </div>

  </main>

</div>


<script>

function sendMessage() {

  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if (!text) return;

  const name =
    localStorage.getItem("peyvand_name") || "من";

  const messages =
    document.getElementById("messages");

  const message =
    document.createElement("div");

  message.className = "message me";

  message.innerHTML = `
    <div class="bubble">
      <strong>${escapeHtml(name)}</strong>
      <br>
      ${escapeHtml(text)}
    </div>
  `;

  messages.appendChild(message);

  input.value = "";

  messages.scrollTop = messages.scrollHeight;
}


function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
