<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیوند | گفتگوی همکاران</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">let starredOnly=false;
function applyMessageFilters(){const q=(document.getElementById("pSearch").value||"").toLowerCase();let stars=[];try{stars=JSON.parse(localStorage.getItem("peyvand_starred_v1")||"[]")}catch(e){}messagesBox.querySelectorAll(".message").forEach(el=>{const row=el.closest("[data-message-id]")||el;const id=String(row.getAttribute("data-message-id")||"");row.style.display=(!q||el.textContent.toLowerCase().includes(q))&&(!starredOnly||stars.includes(id))?"":"none"})}
document.getElementById("pSearch").addEventListener("input",applyMessageFilters);
document.getElementById("pAll").onclick=function(){starredOnly=false;this.classList.add("active");document.getElementById("pStarred").classList.remove("active");applyMessageFilters()};
document.getElementById("pStarred").onclick=function(){starredOnly=true;this.classList.add("active");document.getElementById("pAll").classList.remove("active");applyMessageFilters()};
document.getElementById("pTheme").onclick=function(){document.body.classList.toggle("dark");localStorage.setItem("peyvand_dark",document.body.classList.contains("dark"))};if(localStorage.getItem("peyvand_dark")==="true")document.body.classList.add("dark");
document.getElementById("pEmoji").onclick=function(){const e=prompt("ایموجی را کپی کن و اینجا وارد کن: 😀 😂 😊 🙏 👍 ❤️ 🎉 🤝 💚 ✅ 🚚 ☕ 🌱");if(e){messageInput.value+=e;messageInput.focus()}};
</script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef8f2;color:#173b2b}
.app{max-width:1100px;height:100vh;margin:auto;display:flex;background:white;box-shadow:0 0 25px rgba(0,0,0,.08)}
.sidebar{width:280px;background:#dff2e7;padding:25px 18px;border-left:1px solid #c8e4d3}
.logo{text-align:center;font-size:34px;font-weight:bold;color:#198754;margin-bottom:8px}
.subtitle{text-align:center;color:#557565;margin-bottom:30px}
.user-box{background:white;border-radius:14px;padding:15px;margin-bottom:20px}
.user-name{font-weight:bold;font-size:17px;margin-bottom:7px}
.employee{color:#667;font-size:14px}
.status{margin-top:12px;font-size:13px;color:#198754}
.account-btn{width:100%;margin-top:12px;border:0;border-radius:10px;padding:10px 12px;color:white;font-family:inherit;font-weight:bold;cursor:pointer}
.account-btn.admin{background:#2f7d57}
.account-btn.admin:hover{background:#256447}
.account-btn.logout{background:#b83a3a}
.account-btn.logout:hover{background:#9f3030}
.account-btn:disabled{opacity:.6;cursor:not-allowed}
.chat-title{padding:14px;border-radius:12px;background:#198754;color:white;font-weight:bold}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{height:75px;display:flex;align-items:center;padding:0 25px;border-bottom:1px solid #e5e5e5;background:white}
.header-title{font-size:20px;font-weight:bold}
.live{margin-right:auto;color:#198754;font-size:13px}
.messages{flex:1;overflow-y:auto;padding:25px;background:#f8fcfa}
.empty{text-align:center;color:#899;padding:30px}
.message{max-width:75%;margin-bottom:14px;background:white;border:1px solid #e2eee7;border-radius:14px;padding:11px 14px;box-shadow:0 2px 7px rgba(0,0,0,.04)}
.message.mine{margin-right:auto;background:#dcf5e6;border-color:#c4e9d2}
.message-name{font-size:13px;font-weight:bold;color:#198754;margin-bottom:5px}
.message-text{font-size:15px;line-height:1.8;word-break:break-word}
.message-time{font-size:10px;color:#899;margin-top:5px}
.composer{padding:15px;border-top:1px solid #e5e5e5;background:white;display:flex;gap:10px}
.composer input{flex:1;border:1px solid #cfe2d7;border-radius:12px;padding:13px 15px;font-family:inherit;font-size:15px;outline:none}
.composer input:focus{border-color:#198754}
.composer button{border:0;border-radius:12px;padding:0 25px;background:#198754;color:white;font-family:inherit;font-weight:bold;cursor:pointer}
.composer button:disabled{opacity:.6;cursor:not-allowed}
.composer button:hover:not(:disabled){background:#157347}
@media(max-width:700px){.sidebar{display:none}.message{max-width:90%}}
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
body{font-family:Vazirmatn,Tahoma,sans-serif;background:radial-gradient(ellipse at 10% 0,#d5f2e0,transparent 35%),#f2f7f4;color:#18372b}
.app{max-width:1500px;gap:18px;padding:18px;background:transparent;box-shadow:none}
.sidebar{background:#fff;border:1px solid #e2ece5;border-radius:24px;box-shadow:0 16px 50px #153e2a0c}
.logo{font-size:38px;color:#0e7653}.logo:before{content:"پ";display:grid;place-items:center;margin:0 auto 10px;width:62px;height:62px;border-radius:21px;color:white;background:linear-gradient(145deg,#15966a,#075c40);box-shadow:0 9px 24px #0e765333}
.chat-title{background:linear-gradient(135deg,#15966a,#0b704d);border-radius:14px;box-shadow:0 8px 20px #0e765322}
.main{background:#fff;border:1px solid #e2ece5;border-radius:24px;overflow:hidden;box-shadow:0 16px 50px #153e2a0c}
.header{height:auto;min-height:82px;padding:18px 24px;background:linear-gradient(120deg,#fff,#f7fcf8)}.header-title{font-size:21px}
.live{background:#e8f8ef;padding:8px 12px;border-radius:99px;font-size:11px}
.messages{background:radial-gradient(ellipse at top right,#f0faf4,transparent 45%),#fcfdfc;padding:25px}
.message{border-radius:17px 17px 4px 17px;border-color:#e4eee7;box-shadow:0 5px 18px #173f2a08;padding:12px 15px}.message.mine{border-radius:17px 17px 17px 4px;background:#e3f7eb;border-color:#ccebd8}.message-name{font-size:11px}.message-text{font-size:13px;line-height:1.95}
.composer{background:#fff;padding:14px 16px;border-top:1px solid #e5eee8}.composer input{border-radius:14px;background:#fbfdfb}.composer button{background:linear-gradient(135deg,#15966a,#0b704d);border-radius:14px;box-shadow:0 7px 17px #0e765326}
.p-tools{display:flex;gap:8px;align-items:center;padding:11px 16px;border-bottom:1px solid #e2ece5;background:#fbfdfc;flex-wrap:wrap}.p-tools input{flex:1;min-width:120px;border:1px solid #dfeae3;border-radius:11px;padding:10px 12px;font:12px Vazirmatn,Tahoma,sans-serif;outline:none}.p-tools button{border:1px solid #dfebe3;background:#fff;color:#667c70;border-radius:10px;padding:8px 11px;font:11px Vazirmatn,Tahoma,sans-serif}.p-tools button.active{background:#e3f7eb;color:#0e7653;border-color:#bfe7cf;font-weight:700}.p-star{float:left;margin-right:7px;border:0;background:transparent;color:#b2a06a;font-size:13px;padding:0}.p-star.on{color:#d49a00}
body.dark{background:#101a16;color:#e5f1e9}body.dark .app,body.dark .main,body.dark .sidebar,body.dark .header,body.dark .composer{background:#18251f;color:#e5f1e9}body.dark .messages{background:#142019}body.dark .message{background:#1f3026;color:#e5f1e9;border-color:#33483b}body.dark .message.mine{background:#1d4731}body.dark .p-tools{background:#17241c}body.dark .p-tools input,body.dark .p-tools button{background:#1e2e25;color:#e5f1e9;border-color:#33483b}
@media(max-width:700px){.app{padding:0}.main{border-radius:0;min-height:100vh}.header{padding:15px}.messages{padding:14px}.p-tools{padding:9px}.p-tools input{width:100%;flex-basis:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">پیوند</div>
<div class="subtitle">پیام‌رسان همکاران</div>
<div class="user-box">
<div class="user-name" id="userName">کاربر</div>
<div class="employee" id="employeeNumber">پرسنلی</div>
<div class="status">● حساب فعال</div>
<button id="adminButton" class="account-btn admin" type="button" style="display:none">🛡️ پنل مدیریت</button>
<button id="logoutButton" class="account-btn logout" type="button">🚪 خروج از حساب</button>
</div>
<div class="chat-title">💬 گفتگوی همکاران</div>
</aside>
<main class="main">
<header class="header">
<div class="header-title">گفتگوی همکاران</div>
<div class="live" id="connectionStatus">در حال اتصال...</div>
</header>
<div class="p-tools"><input id="pSearch" type="search" placeholder="جست‌وجو در پیام‌ها..."><button class="active" id="pAll">همه پیام‌ها</button><button id="pStarred">⭐ نشان‌شده</button><button id="pTheme">◐ حالت شب</button><button id="pEmoji">☺ ایموجی</button></div><section class="messages" id="messages"><div class="empty">در حال دریافت پیام‌ها...</div></section>
<div class="composer">
<input id="messageInput" type="text" maxlength="2000" placeholder="پیام خود را بنویسید..." autocomplete="off">
<button id="sendButton" type="button">ارسال</button>
</div>
</main>
</div>
<script>
const SUPABASE_URL="https://ydgfjupryhuiyriaxvin.supabase.co";
const SUPABASE_KEY="sb_publishable__hlPVmThO6PDb-_LSvMzWw_uAeHKMxs";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
let currentRole="user";

async function requireSession(){
 const {data:{session},error}=await supabaseClient.auth.getSession();
 if(error||!session){
  localStorage.removeItem("peyvand_name");localStorage.removeItem("peyvand_employee");localStorage.removeItem("peyvand_user_id");
  window.location.replace("index.html");return false;
 }
 currentUser=session.user;
 const {data:employee,error:employeeError}=await supabaseClient.from("peyvand_employees").select("full_name,employee_number,email,is_active").eq("user_id",currentUser.id).maybeSingle();
 if(employeeError||!employee||!employee.is_active){
  await supabaseClient.auth.signOut();
  localStorage.removeItem("peyvand_name");localStorage.removeItem("peyvand_employee");localStorage.removeItem("peyvand_user_id");
  alert("دسترسی این حساب غیرفعال شده است.");
  window.location.replace("index.html");return false;
 }
 userName=employee.full_name||"کاربر";
 employeeNumber=employee.employee_number||"بدون شماره پرسنلی";
 document.getElementById("userName").textContent=userName;
 document.getElementById("employeeNumber").textContent="پرسنلی: "+employeeNumber;
 localStorage.setItem("peyvand_name",userName);
 localStorage.setItem("peyvand_employee",employeeNumber);
 localStorage.setItem("peyvand_user_id",currentUser.id);
 const {data:roleData}=await supabaseClient.from("peyvand_user_roles").select("role").eq("user_id",currentUser.id).maybeSingle();
 currentRole=roleData?.role||"user";
 return true;
}

document.getElementById("logoutButton").addEventListener("click",async function(){
 this.disabled=true;this.textContent="در حال خروج...";
 await supabaseClient.auth.signOut();
 localStorage.removeItem("peyvand_name");localStorage.removeItem("peyvand_employee");localStorage.removeItem("peyvand_user_id");
 window.location.replace("index.html");
});
document.getElementById("adminButton").addEventListener("click",function(){window.location.href="admin.html"});

const messagesBox=document.getElementById("messages");
const messageInput=document.getElementById("messageInput");
const sendButton=document.getElementById("sendButton");
const connectionStatus=document.getElementById("connectionStatus");

function escapeHtml(text){const div=document.createElement("div");div.textContent=text;return div.innerHTML}

function showMessage(message){
 if(document.querySelector('[data-message-id="'+message.id+'"]'))return;
 const empty=messagesBox.querySelector(".empty");if(empty)empty.remove();
 const div=document.createElement("div");div.className="message";div.setAttribute("data-message-id",message.id);
 if(message.employee===employeeNumber)div.classList.add("mine");
 const time=new Date(message.created_at).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
 div.innerHTML='<div class="message-name">'+escapeHtml(message.name)+'</div><div class="message-text">'+escapeHtml(message.message)+'</div><div class="message-time">'+time+"</div>";
 const star=document.createElement("button");star.className="p-star";star.type="button";star.textContent="☆";star.title="نشان‌کردن پیام";const key="peyvand_starred_v1";let saved=[];try{saved=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}if(saved.includes(String(message.id))){star.classList.add("on");star.textContent="★"}star.onclick=function(){let a=[];try{a=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}const id=String(message.id);a=a.includes(id)?a.filter(x=>x!==id):a.concat(id);localStorage.setItem(key,JSON.stringify(a));star.classList.toggle("on",a.includes(id));star.textContent=a.includes(id)?"★":"☆";applyMessageFilters()};div.querySelector(".message-name").appendChild(star);messagesBox.appendChild(div);messagesBox.scrollTop=messagesBox.scrollHeight;
}

async function loadMessages(){
 const {data,error}=await supabaseClient.from("peyvand_messages").select("*").eq("room","general").order("created_at",{ascending:true});
 if(error){console.error("LOAD ERROR:",error);messagesBox.innerHTML='<div class="empty">خطا در دریافت پیام‌ها</div>';return}
 messagesBox.innerHTML="";
 if(!data||data.length===0){messagesBox.innerHTML='<div class="empty">هنوز پیامی ارسال نشده است.</div>';return}
 data.forEach(showMessage);
}

async function sendMessage(){
 const text=messageInput.value.trim();if(!text)return;
 sendButton.disabled=true;
 const newMessage={room:"general",name:document.getElementById("userName").textContent||"همکار",employee:document.getElementById("employeeNumber").textContent.replace("پرسنلی: ","")||"",message:text};
 const {data,error}=await supabaseClient.from("peyvand_messages").insert(newMessage).select().single();
 if(error){console.error("SEND ERROR:",error);alert("پیام ارسال نشد:\n"+error.message);sendButton.disabled=false;return}
 if(data)showMessage(data);
 messageInput.value="";messageInput.focus();sendButton.disabled=false;
}

sendButton.addEventListener("click",sendMessage);
messageInput.addEventListener("keydown",function(event){if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();sendMessage()}});

const channel=supabaseClient.channel("peyvand-live-chat").on("postgres_changes",{event:"INSERT",schema:"public",table:"peyvand_messages",filter:"room=eq.general"},function(payload){
 console.log("REALTIME:",payload);showMessage(payload.new);
}).subscribe(function(status){
 console.log("REALTIME STATUS:",status);
 if(status==="SUBSCRIBED"){connectionStatus.textContent="● اتصال زنده برقرار است";connectionStatus.style.color="#198754"}
 else{connectionStatus.textContent="● در حال اتصال...";connectionStatus.style.color="#b7791f"}
});

(async function startApp(){
 const ok=await requireSession();if(!ok)return;
 if(currentRole==="owner"||currentRole==="admin")document.getElementById("adminButton").style.display="block";
 await loadMessages();
 setInterval(async function(){
  const {data:employee}=await supabaseClient.from("peyvand_employees").select("is_active").eq("user_id",currentUser.id).maybeSingle();
  if(!employee||!employee.is_active){await supabaseClient.auth.signOut();localStorage.clear();window.location.replace("index.html")}
 },60000);
})();

supabaseClient.auth.onAuthStateChange(function(event,session){
 if(event==="SIGNED_OUT"||!session){
  localStorage.removeItem("peyvand_name");localStorage.removeItem("peyvand_employee");localStorage.removeItem("peyvand_user_id");
  if(!window.location.pathname.endsWith("index.html"))window.location.replace("index.html");
 }
});
</script>
</body>
</html>
