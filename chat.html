<script>
const SUPABASE_URL="https://ydgfjupryhuiyriaxvin.supabase.co";
const SUPABASE_KEY="sb_publishable__hlPVmThO6PDb-_LSvMzWw_uAeHKMxs";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function requireSession(){
 const {data:{session},error}=await supabaseClient.auth.getSession();
 if(error||!session){
  localStorage.removeItem("peyvand_name");localStorage.removeItem("peyvand_employee");localStorage.removeItem("peyvand_user_id");

  document.getElementById("employeeNumber").textContent=employeeNumber;
  document.getElementById("connectionStatus").textContent="● پیش‌نمایش برنامه";
  document.getElementById("connectionStatus").style.color="#168b69";
  document.getElementById("messageInput").disabled=true;
  document.getElementById("messageInput").placeholder="برای ارسال پیام باید وارد حساب شوید";
  document.getElementById("sendButton").disabled=true;
  document.getElementById("sendButton").textContent="فقط مشاهده";
  document.getElementById("logoutButton").textContent="ورود همکاران";
  document.getElementById("logoutButton").onclick=function(){window.location.href="index.html?login=1"};
  const empty=document.getElementById("messages");
  empty.innerHTML='<div class="empty" style="max-width:560px;margin:10vh auto;padding:32px 24px;text-align:center"><div style="font-size:42px;margin-bottom:12px">💚</div><h2 style="margin:0 0 10px;color:#087b52">به پیوند خوش آمدید</h2><p style="line-height:1.9;margin:0 0 14px">شما در حالت پیش‌نمایش هستید. می‌توانید ظاهر محیط پیام‌رسان را ببینید؛ برای گفتگو، ارسال پیام و امکانات مدیریتی باید با حساب تأییدشده وارد شوید.</p><button type="button" id="demoLoginButton" class="secondary" style="padding:11px 18px;border-radius:14px;font:inherit;cursor:pointer">ورود همکاران</button></div>';
  document.getElementById("demoLoginButton").addEventListener("click",()=>window.location.href="index.html?login=1");
  document.getElementById("adminButton").style.display="none";
  return true;
 }
 currentUser=session.user;
 const {data:employee,error:employeeError}=await supabaseClient.from("peyvand_employees").select("full_name,employee_number,email,is_active").eq("user_id",currentUser.id).maybeSingle();
 if(employeeError||!employee||!employee.is_active){

  window.location.replace("index.html");return false;
 }
 userName=employee.full_name||"کاربر";
 employeeNumber=employee.employee_number||"بدون شماره پرسنلی";
 document.getElementById("userName").textContent=userName;
 document.getElementById("employeeNumber").textContent="پرسنلی: "+employeeNumber;
 localStorage.setItem("peyvand_name",userName);
 localStorage.setItem("peyvand_employee",employeeNumber);
 localStorage.setItem("peyvand_user_id",currentUser.id);
 const {data:roleData}=await supabaseClient.from("peyvand_user_roles").select("role").eq("user_id",currentUser.id).maybeSingle();

 await supabaseClient.auth.signOut();

const messagesBox=document.getElementById("messages");
const messageInput=document.getElementById("messageInput");
const sendButton=document.getElementById("sendButton");
const connectionStatus=document.getElementById("connectionStatus");

function escapeHtml(text){const div=document.createElement("div");div.textContent=text;return div.innerHTML}

function showMessage(message,prepend=false){
 if(document.querySelector('[data-message-id="'+message.id+'"]'))return;
 const empty=messagesBox.querySelector(".empty");if(empty)empty.remove();
 const div=document.createElement("div");div.className="message";div.setAttribute("data-message-id",message.id);
 if(message.employee===employeeNumber)div.classList.add("mine");
 const time=new Date(message.created_at).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
 div.innerHTML='<div class="message-name">'+escapeHtml(message.name)+'</div><div class="message-text">'+escapeHtml(message.message)+'</div><div class="message-time">'+time+"</div>";
 const star=document.createElement("button");star.className="p-star";star.type="button";star.textContent="☆";star.title="نشان‌کردن پیام";const key="peyvand_starred_v1";let saved=[];try{saved=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}if(saved.includes(String(message.id))){star.classList.add("on");star.textContent="★"}star.onclick=function(){let a=[];try{a=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}const id=String(message.id);a=a.includes(id)?a.filter(x=>x!==id):a.concat(id);localStorage.setItem(key,JSON.stringify(a));star.classList.toggle("on",a.includes(id));star.textContent=a.includes(id)?"★":"☆";applyMessageFilters()};const reply=document.createElement("button");reply.className="p-action";reply.type="button";reply.textContent="↩ پاسخ";reply.onclick=function(){messageInput.value="↪ پاسخ به "+(message.name||"همکار")+": "+String(message.message||"").slice(0,90)+"\\n"+messageInput.value;messageInput.focus()};const copy=document.createElement("button");copy.className="p-action";copy.type="button";copy.textContent="کپی";copy.onclick=async function(){try{await navigator.clipboard.writeText(String(message.message||""));alert("متن پیام کپی شد")}catch(e){messageInput.value=String(message.message||"");messageInput.focus()}};div.querySelector(".message-name").appendChild(star);div.querySelector(".message-name").appendChild(reply);div.querySelector(".message-name").appendChild(copy);if(prepend){const first=messagesBox.querySelector(".message");if(first)messagesBox.insertBefore(div,first);else messagesBox.appendChild(div)}else{messagesBox.appendChild(div);messagesBox.scrollTop=messagesBox.scrollHeight}
}

let oldestLoadedMessageAt=null;
let olderMessagesButton=null;
let loadingOlderMessages=false;

function ensureOlderMessagesButton(){
 if(olderMessagesButton)return olderMessagesButton;
 olderMessagesButton=document.createElement("button");
 olderMessagesButton.type="button";
 olderMessagesButton.className="secondary";
 olderMessagesButton.textContent="بارگذاری پیام‌های قدیمی‌تر";
 olderMessagesButton.style.cssText="display:block;margin:10px auto 16px;padding:9px 16px;border-radius:14px;font:inherit;font-size:13px;cursor:pointer";
 olderMessagesButton.addEventListener("click",loadOlderMessages);
 messagesBox.prepend(olderMessagesButton);
 return olderMessagesButton;
}

async function loadMessages(){
 const {data,error}=await supabaseClient.from("peyvand_messages").select("*").eq("room","general").order("created_at",{ascending:false}).limit(100);
 if(error){console.error("LOAD ERROR:",error);messagesBox.innerHTML='<div class="empty">خطا در دریافت پیام‌ها</div>';return}
 messagesBox.innerHTML="";
 const rows=(data||[]).reverse();
 if(!rows.length){messagesBox.innerHTML='<div class="empty">هنوز پیامی ارسال نشده است.</div>';return}
 oldestLoadedMessageAt=rows[0].created_at;
 rows.forEach(showMessage);
 ensureOlderMessagesButton();
 messagesBox.scrollTop=messagesBox.scrollHeight;
}

async function loadOlderMessages(){
 if(loadingOlderMessages||!oldestLoadedMessageAt)return;
 loadingOlderMessages=true;
 const btn=ensureOlderMessagesButton();
 btn.disabled=true;btn.textContent="در حال بارگذاری...";
 const previousHeight=messagesBox.scrollHeight;
 const previousTop=messagesBox.scrollTop;
 const {data,error}=await supabaseClient.from("peyvand_messages").select("*").eq("room","general").lt("created_at",oldestLoadedMessageAt).order("created_at",{ascending:false}).limit(100);
 if(error){
  console.error("OLDER MESSAGES ERROR:",error);
  btn.textContent="بارگذاری پیام‌های قدیمی‌تر";
  btn.disabled=false;loadingOlderMessages=false;return;
 }
 const rows=(data||[]).reverse();
 if(!rows.length){
  btn.textContent="پیام قدیمی‌تری وجود ندارد";
  btn.disabled=true;loadingOlderMessages=false;return;
 }
 rows.forEach(message=>showMessage(message,true));
 oldestLoadedMessageAt=rows[0].created_at;
 applyMessageFilters();
 messagesBox.scrollTop=previousTop+(messagesBox.scrollHeight-previousHeight);
 btn.textContent="بارگذاری پیام‌های قدیمی‌تر";btn.disabled=false;loadingOlderMessages=false;
}
async function sendMessage(){
 if(demoMode){alert("برای ارسال پیام باید با حساب تأییدشده وارد شوید.");return;}
 const text=messageInput.value.trim();if(!text)return;
 sendButton.disabled=true;
 const newMessage={room:"general",name:document.getElementById("userName").textContent||"همکار",employee:document.getElementById("employeeNumber").textContent.replace("پرسنلی: ","")||"",message:text};
 const {data,error}=await supabaseClient.from("peyvand_messages").insert(newMessage).select().single();
 if(error){console.error("SEND ERROR:",error);alert("پیام ارسال نشد:\n"+error.message);sendButton.disabled=false;return}
 if(data)showMessage(data);
 messageInput.value="";messageInput.focus();sendButton.disabled=false;
}

sendButton.addEventListener("click",sendMessage);
messageInput.addEventListener("keydown",function(event){if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();sendMessage()}});

function subscribeRealtime(){
 const channel=supabaseClient.channel("peyvand-live-chat").on("postgres_changes",{event:"INSERT",schema:"public",table:"peyvand_messages",filter:"room=eq.general"},function(payload){
  console.log("REALTIME:",payload);showMessage(payload.new);
 }).subscribe(function(status){
  console.log("REALTIME STATUS:",status);
  if(status==="SUBSCRIBED"){connectionStatus.textContent="● اتصال زنده برقرار است";connectionStatus.style.color="#198754"}
  else{connectionStatus.textContent="● در حال اتصال...";connectionStatus.style.color="#b7791f"}
 });
}

(async function startApp(){
 const ok=await requireSession();if(!ok)return;
 if(demoMode)return;
 if(currentRole==="owner"||currentRole==="admin")document.getElementById("adminButton").style.display="block";
 await loadMessages();
 subscribeRealtime();
 setInterval(async function(){
  const {data:employee}=await supabaseClient.from("peyvand_employees").select("is_active").eq("user_id",currentUser.id).maybeSingle();
  if(!employee||!employee.is_active){await supabaseClient.auth.signOut();localStorage.removeItem("peyvand_name");localStorage.removeItem("peyvand_employee");localStorage.removeItem("peyvand_user_id");window.location.replace("index.html")}
 },60000);
})();

supabaseClient.auth.onAuthStateChange(function(event,session){
 // Do not navigate from this callback: Supabase may emit an initial auth event
 // while the guest-preview check is still running. Redirecting here caused a loop.
 // The explicit logout button and account-status check handle navigation safely.
 if(event==="SIGNED_OUT"){
  localStorage.removeItem("peyvand_name");
  localStorage.removeItem("peyvand_employee");
  localStorage.removeItem("peyvand_user_id");
 }
});
let starredOnly=false;
function applyMessageFilters(){const q=(document.getElementById("pSearch").value||"").toLowerCase();let stars=[];try{stars=JSON.parse(localStorage.getItem("peyvand_starred_v1")||"[]")}catch(e){}messagesBox.querySelectorAll(".message").forEach(el=>{const row=el.closest("[data-message-id]")||el;const id=String(row.getAttribute("data-message-id")||"");row.style.display=(!q||el.textContent.toLowerCase().includes(q))&&(!starredOnly||stars.includes(id))?"":"none"})}
document.getElementById("pSearch").addEventListener("input",applyMessageFilters);
document.getElementById("pAll").onclick=function(){starredOnly=false;this.classList.add("active");document.getElementById("pStarred").classList.remove("active");applyMessageFilters()};
document.getElementById("pStarred").onclick=function(){starredOnly=true;this.classList.add("active");document.getElementById("pAll").classList.remove("active");applyMessageFilters()};
document.getElementById("pTheme").onclick=function(){document.body.classList.toggle("dark");localStorage.setItem("peyvand_dark",document.body.classList.contains("dark"))};if(localStorage.getItem("peyvand_dark")==="true")document.body.classList.add("dark");
document.getElementById("pEmoji").onclick=function(){const e=prompt("ایموجی را کپی کن و اینجا وارد کن: 😀 😂 😊 🙏 👍 ❤️ 🎉 🤝 💚 ✅ 🚚 ☕ 🌱");if(e){messageInput.value+=e;messageInput.focus()}};
</script>
