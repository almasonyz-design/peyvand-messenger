<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیوند | گفتگوی همکاران</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #eef8f2;
      color: #173b2b;
    }

    .app {
      max-width: 1100px;
      height: 100vh;
      margin: auto;
      display: flex;
      background: white;
      box-shadow: 0 0 25px rgba(0,0,0,.08);
    }

    .sidebar {
      width: 280px;
      background: #dff2e7;
      padding: 25px 18px;
      border-left: 1px solid #c8e4d3;
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      color: #198754;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #557565;
      margin-bottom: 30px;
    }

    .user-box {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .user-name {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 7px;
    }

    .employee {
      color: #667;
      font-size: 14px;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #198754;
    }

    .chat-title {
      padding: 14px;
      border-radius: 12px;
      background: #198754;
      color: white;
      font-weight: bold;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      height: 75px;
      display: flex;
      align-items: center;
      padding: 0 25px;
      border-bottom: 1px solid #e5e5e5;
      background: white;
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
    }

    .live {
      margin-right: auto;
      color: #198754;
      font-size: 13px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      background: #f8fcfa;
    }

    .message {
      max-width: 75%;
      margin-bottom: 14px;
      background: white;
      border: 1px solid #e2eee7;
      border-radius: 14px;
      padding: 11px 14px;
      box-shadow: 0 2px 7px rgba(0,0,0,.04);
    }

    .message.mine {
      margin-right: auto;
      background: #dcf5e6;
      border-color: #c4e9d2;
    }

    .message-name {
      font-size: 13px;
      font-weight: bold;
      color: #198754;
      margin-bottom: 5px;
    }

    .message-text {
      font-size: 15px;
      line-height: 1.8;
      word-break: break-word;
    }

    .message-time {
      font-size: 10px;
      color: #899;
      margin-top: 5px;
    }

    .composer {
      padding: 15px;
      border-top: 1px solid #e5e5e5;
      background: white;
      display: flex;
      gap: 10px;
    }

    .composer input {
      flex: 1;
      border: 1px solid #cfe2d7;
      border-radius: 12px;
      padding: 13px 15px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .composer input:focus {
      border-color: #198754;
    }

    .composer button {
      border: 0;
      border-radius: 12px;
      padding: 0 25px;
      background: #198754;
      color: white;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .composer button:hover {
      background: #157347;
    }

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">پیوند</div>
    <div class="subtitle">پیام‌رسان همکاران</div>

    <div class="user-box">
      <div class="user-name" id="userName">کاربر</div>
      <div class="employee" id="employeeNumber">شماره پرسنلی</div>
      <div class="status">● آنلاین</div>
    </div>

    <div class="chat-title">
      💬 گفتگوی همکاران
    </div>
  </aside>

  <main class="main">

    <header class="header">
      <div class="header-title">گفتگوی همکاران</div>
      <div class="live" id="connectionStatus">
        در حال اتصال...
      </div>
    </header>

    <section class="messages" id="messages">
      <div style="text-align:center;color:#899;padding:30px">
        در حال دریافت پیام‌ها...
      </div>
    </section>

    <div class="composer">
      <input
        id="messageInput"
        type="text"
        maxlength="2000"
        placeholder="پیام خود را بنویسید..."
        autocomplete="off"
      >

      <button id="sendButton">
        ارسال
      </button>
    </div>

  </main>

</div>

<script>

  // ==============================
  // اتصال پروژه پیوند به Supabase
  // ==============================

  const SUPABASE_URL =
    "https://ydgfjupryhuiyriaxvin.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable__hlPVmThO6PDb-_LSvMzWw_uAeHKMxs";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==============================
  // اطلاعات کاربر
  // ==============================

  const userName =
    localStorage.getItem("peyvand_name") || "کاربر";

  const employeeNumber =
    localStorage.getItem("peyvand_employee") || "بدون شماره پرسنلی";


  document.getElementById("userName").textContent =
    userName;

  document.getElementById("employeeNumber").textContent =
    "پرسنلی: " + employeeNumber;


  // ==============================
  // نمایش پیام
  // ==============================

  const messagesBox =
    document.getElementById("messages");

  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  function showMessage(message) {

    // اگر پیام قبلی placeholder بود
    const first = messagesBox.firstElementChild;

    if (
      first &&
      first.textContent.includes("در حال دریافت")
    ) {
      messagesBox.innerHTML = "";
    }

    const div =
      document.createElement("div");

    div.className = "message";

    if (
      message.employee === employeeNumber
    ) {
      div.classList.add("mine");
    }

    const time =
      new Date(message.created_at)
        .toLocaleTimeString("fa-IR", {
          hour: "2-digit",
          minute: "2-digit"
        });

    div.innerHTML = `
      <div class="message-name">
        ${escapeHtml(message.name)}
      </div>

      <div class="message-text">
        ${escapeHtml(message.message)}
      </div>

      <div class="message-time">
        ${time}
      </div>
    `;

    messagesBox.appendChild(div);

    messagesBox.scrollTop =
      messagesBox.scrollHeight;
  }


  // ==============================
  // دریافت پیام‌های قبلی
  // ==============================

  async function loadMessages() {

    const { data, error } =
      await supabaseClient
        .from("peyvand_messages")
        .select("*")
        .eq("room", "general")
        .order("created_at", {
          ascending: true
        });

    if (error) {

      console.error(error);

      messagesBox.innerHTML = `
        <div style="
          text-align:center;
          color:#b42318;
          padding:30px;
        ">
          خطا در دریافت پیام‌ها
        </div>
      `;

      return;
    }

    messagesBox.innerHTML = "";

    if (!data || data.length === 0) {

      messagesBox.innerHTML = `
        <div style="
          text-align:center;
          color:#899;
          padding:30px;
        ">
          هنوز پیامی ارسال نشده است.
        </div>
      `;

      return;
    }

    data.forEach(showMessage);
  }


  // ==============================
  // ارسال پیام
  // ==============================

  async function sendMessage() {

    const input =
      document.getElementById("messageInput");

    const text =
      input.value.trim();

    if (!text) return;


    const button =
      document.getElementById("sendButton");

    button.disabled = true;

    const { error } =
      await supabaseClient
        .from("peyvand_messages")
        .insert({
          room: "general",
          name: userName,
          employee: employeeNumber,
          message: text
        });


    button.disabled = false;


    if (error) {

      console.error(error);

      alert(
        "پیام ارسال نشد:\n" +
        error.message
      );

      return;
    }


    input.value = "";

    input.focus();
  }


  // ==============================
  // دکمه ارسال
  // ==============================

  document
    .getElementById("sendButton")
    .addEventListener(
      "click",
      sendMessage
    );


  // ارسال با Enter

  document
    .getElementById("messageInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();
        }

      }
    );


  // ==============================
  // اتصال لحظه‌ای Realtime
  // ==============================

  const channel =
    supabaseClient
      .channel("peyvand-live-chat")

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "peyvand_messages",
          filter: "room=eq.general"
        },

        function(payload) {

          showMessage(payload.new);

        }
      )

      .subscribe(function(status) {

        const statusBox =
          document.getElementById(
            "connectionStatus"
          );

        if (status === "SUBSCRIBED") {

          statusBox.textContent =
            "● اتصال زنده برقرار است";

          statusBox.style.color =
            "#198754";

        } else {

          statusBox.textContent =
            "● در حال اتصال...";

          statusBox.style.color =
            "#b7791f";
        }

      });


  // ==============================
  // شروع برنامه
  // ==============================

  loadMessages();

</script>

</body>
</html>
