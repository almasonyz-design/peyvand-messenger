<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پیوند | پنل مدیریت</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f3f8f5;margin:0;color:#17352a}
header{background:#2f7d57;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
main{max-width:1200px;margin:24px auto;padding:0 16px}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 18px #00000012}
h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
button,select{border:0;border-radius:10px;padding:9px 12px;cursor:pointer}
button{background:#2f7d57;color:white}.danger{background:#b83a3a}.muted{color:#667}.badge{padding:5px 9px;border-radius:20px;background:#e7f4ec;display:inline-block}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5ece8;text-align:right}
.hidden{display:none}.error{color:#b00020}.ok{color:#167447}
.actions{display:flex;gap:8px;flex-wrap:wrap}input,select{width:100%;box-sizing:border-box;border:1px solid #d9e5df;border-radius:10px;padding:10px;margin-top:7px;background:white}label{display:block;font-weight:bold;font-size:14px}
</style>
</head>
<body>
<header>
  <strong>🌿 پیوند — پنل مدیریت</strong>
  <div><span id="roleBadge"></span> <button id="backBtn">بازگشت به چت</button> <button id="logoutBtn" class="danger">خروج</button></div>
</header>
<main>
  <div id="status" class="card">در حال بررسی دسترسی...</div>


  <section id="addUserPanel" class="card hidden">
    <h2>➕ افزودن همکار</h2>
    <p class="muted">فقط Owner می‌تواند حساب جدید بسازد.</p>
    <div class="grid">
      <div><label>نام و نام خانوادگی</label><input id="newFullName" type="text" placeholder="مثلاً محمد احمدی"></div>
      <div><label>شماره پرسنلی</label><input id="newEmployeeNumber" type="text" placeholder="مثلاً 10002"></div>
      <div><label>شماره همراه</label><input id="newPhone" type="tel" placeholder="09121234567" dir="ltr"></div>
      <div><label>نقش</label><select id="newRole"><option value="user">کاربر عادی</option><option value="admin">Admin</option></select></div>
    </div>
    <div class="actions" style="margin-top:16px"><button id="createUserBtn">ساخت حساب</button></div>
    <div id="createUserResult" style="margin-top:14px"></div>
  </section>

  <section id="ownerPanel" class="card hidden">
    <h2>👑 مدیریت نقش‌ها</h2>
    <p class="muted">فقط Owner می‌تواند نقش کاربران را تغییر دهد.</p>
    <div id="rolesTable"></div>
  </section>

  <section id="usersPanel" class="card hidden">
    <h2>👥 مدیریت کاربران</h2>
    <div id="usersTable"></div>
  </section>

  <section id="auditPanel" class="card hidden"><h2>🛡️ لاگ امنیتی</h2><p class="muted">فقط Owner می‌تواند رویدادهای امنیتی سیستم را مشاهده کند.</p><div id="auditTable"></div></section>

  <section id="messagesPanel" class="card hidden">
    <h2>💬 مدیریت پیام‌ها</h2>
    <div id="messagesTable"></div>
  </section>
</main>

<script>
const SUPABASE_URL="https://ydgfjupryhuiyriaxvin.supabase.co";
const SUPABASE_KEY="sb_publishable__hlPVmThO6PDb-_LSvMzWw_uAeHKMxs";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const statusBox=document.getElementById("status");
const ownerPanel=document.getElementById("ownerPanel");
const usersPanel=document.getElementById("usersPanel");
const messagesPanel=document.getElementById("messagesPanel");
const auditPanel=document.getElementById("auditPanel");

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function showError(msg){statusBox.innerHTML='<span class="error">'+esc(msg)+'</span>';}

document.getElementById("backBtn").onclick=()=>location.href="chat.html";
document.getElementById("logoutBtn").onclick=async function(){
  this.disabled=true;
  this.textContent="در حال خروج...";
  await supabaseClient.auth.signOut();
  localStorage.removeItem("peyvand_name");
  localStorage.removeItem("peyvand_employee");
  localStorage.removeItem("peyvand_user_id");
  location.replace("index.html");
};

async function getMyRole(){
  const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
  if(sessionError||!session) throw new Error("نشست ورود شما منقضی شده است.");
  const user=session.user;

  const {data:employee,error:employeeError}=await supabaseClient
    .from("peyvand_employees")
    .select("is_active")
    .eq("user_id",user.id)
    .maybeSingle();

  if(employeeError||!employee||!employee.is_active){
    await supabaseClient.auth.signOut();
    localStorage.clear();
    throw new Error("دسترسی این حساب غیرفعال شده است.");
  }

  const {data,error}=await supabaseClient.from("peyvand_user_roles").select("role").eq("user_id",user.id).maybeSingle();
  if(error) throw error;
  if(!data) throw new Error("برای این حساب نقشی ثبت نشده است.");
  return {user,role:data.role};
}

async function loadUsers(role){
  const {data,error}=await supabaseClient.from("peyvand_employees")
    .select("id,user_id,full_name,employee_number,email,is_active,created_at")
    .order("created_at",{ascending:false});
  if(error){document.getElementById("usersTable").innerHTML='<p class="error">'+esc(error.message)+'</p>';return;}

  const {data:roles,error:rolesError}=await supabaseClient
    .from("peyvand_user_roles")
    .select("user_id,role");
  if(rolesError){document.getElementById("usersTable").innerHTML='<p class="error">'+esc(rolesError.message)+'</p>';return;}

  const roleMap=new Map((roles||[]).map(r=>[r.user_id,r.role]));

  let html='<table><tr><th>نام</th><th>پرسنلی</th><th>ایمیل</th><th>نقش</th><th>وضعیت</th><th>عملیات</th></tr>';
  for(const u of data||[]){
    const targetRole=roleMap.get(u.user_id)||"user";
    let action="";

    if(role==="owner"){
      action = targetRole==="owner"
        ? '<span class="muted">مالک سیستم</span>'
        : '<button data-toggle="'+esc(u.id)+'" data-active="'+u.is_active+'">'+(u.is_active?"مسدود کردن":"فعال کردن")+'</button>';
    }else if(role==="admin"){
      action = targetRole==="user"
        ? '<button data-toggle="'+esc(u.id)+'" data-active="'+u.is_active+'">'+(u.is_active?"مسدود کردن":"فعال کردن")+'</button>'
        : '<span class="muted">قابل مدیریت نیست</span>';
    }

    html+='<tr><td>'+esc(u.full_name)+'</td><td>'+esc(u.employee_number)+'</td><td>'+esc(u.email)+'</td>'+
      '<td><span class="badge">'+esc(targetRole==="owner"?"Owner":targetRole==="admin"?"Admin":"User")+'</span></td>'+
      '<td><span class="badge">'+(u.is_active?"فعال":"مسدود")+'</span></td><td>'+action+'</td></tr>';
  }
  html+='</table>'; document.getElementById("usersTable").innerHTML=html;

  document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.toggle, active=b.dataset.active==="true";
    if(!confirm((active?"این حساب مسدود شود؟":"این حساب فعال شود؟"))) return;

    const row=(data||[]).find(x=>String(x.id)===String(id));
    if(!row) return;

    const targetRole=roleMap.get(row.user_id)||"user";
    if(role==="admin" && targetRole!=="user"){
      alert("Admin فقط می‌تواند کاربران عادی را فعال یا مسدود کند.");
      return;
    }
    if(role==="owner" && targetRole==="owner"){
      alert("حساب Owner قابل مسدود کردن نیست.");
      return;
    }

    const {error}=await supabaseClient.from("peyvand_employees")
      .update({is_active:!active})
      .eq("id",id);

    if(error) alert("عملیات انجام نشد: "+error.message);
    else await loadUsers(role);
  });
}

async function loadAuditLogs(){
  const box=document.getElementById("auditTable");
  const {data,error}=await supabaseClient.from("peyvand_audit_logs")
    .select("id,actor_user_id,target_user_id,target_id,action,details,created_at")
    .order("created_at",{ascending:false}).limit(200);
  if(error){box.innerHTML='<p class="error">'+esc(error.message)+'</p>';return;}
  const rows=data||[];
  let html='<table><tr><th>زمان</th><th>عملیات</th><th>شناسه هدف</th><th>جزئیات</th></tr>';
  for(const r of rows){
    html+='<tr><td>'+new Date(r.created_at).toLocaleString("fa-IR")+'</td><td>'+esc(r.action)+'</td><td dir="ltr">'+esc(r.target_id||"")+'</td><td><code>'+esc(JSON.stringify(r.details||{}))+'</code></td></tr>';
  }
  html+='</table>';
  box.innerHTML=html;
}

async function loadMessages(){
  const {data,error}=await supabaseClient.from("peyvand_messages").select("id,name,employee,message,created_at").eq("room","general").order("created_at",{ascending:false}).limit(100);
  if(error){document.getElementById("messagesTable").innerHTML='<p class="error">'+esc(error.message)+'</p>';return;}
  let html='<table><tr><th>زمان</th><th>فرستنده</th><th>پرسنلی</th><th>پیام</th><th></th></tr>';
  for(const m of data||[]){
    html+='<tr><td>'+new Date(m.created_at).toLocaleString("fa-IR")+'</td><td>'+esc(m.name)+'</td><td>'+esc(m.employee)+'</td><td>'+esc(m.message)+'</td><td><button class="danger" data-delete="'+m.id+'">حذف</button></td></tr>';
  }
  html+='</table>'; document.getElementById("messagesTable").innerHTML=html;
  document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{
    if(!confirm("این پیام حذف شود؟")) return;
    const {error}=await supabaseClient.from("peyvand_messages").delete().eq("id",b.dataset.delete);
    if(error) alert(error.message); else loadMessages();
  });
}


async function createNewUser(){
  const result=document.getElementById("createUserResult");
  const btn=document.getElementById("createUserBtn");
  const full_name=document.getElementById("newFullName").value.trim();
  const employee_number=document.getElementById("newEmployeeNumber").value.trim();
  const phone=document.getElementById("newPhone").value.trim();
  const role=document.getElementById("newRole").value;
  result.innerHTML="";
  if(!full_name||!employee_number||!phone){result.innerHTML='<p class="error">نام، شماره پرسنلی و شماره همراه الزامی است.</p>';return;}
  btn.disabled=true;btn.textContent="در حال ساخت حساب...";
  try{
    const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
    if(sessionError||!session) throw new Error("نشست Owner معتبر نیست.");
    const {data,error}=await supabaseClient.functions.invoke("create-peyvand-user",{body:{full_name,employee_number,phone,role}});
    if(error) throw new Error(error.message||"ساخت حساب انجام نشد.");
    if(!data?.success) throw new Error(data?.error||"ساخت حساب انجام نشد.");
    result.innerHTML='<div class="card" style="margin:0;background:#eaf7ef"><strong class="ok">✅ حساب با موفقیت ساخته شد.</strong><p>نام: '+esc(data.full_name)+'</p><p>شماره پرسنلی: '+esc(data.employee_number)+'</p><p>شماره همراه: '+esc(data.phone)+'</p><p>نقش: '+esc(data.role==="admin"?"Admin":"کاربر عادی")+'</p><p><strong>🔑 رمز موقت: <span dir="ltr">'+esc(data.temporary_password)+'</span></strong></p><p class="muted">این رمز را فقط در اختیار صاحب حساب قرار بده.</p></div>';
    document.getElementById("newFullName").value="";
    document.getElementById("newEmployeeNumber").value="";
    document.getElementById("newPhone").value="";
    document.getElementById("newRole").value="user";
    await loadUsers("owner");
    await loadRoles();
  }catch(e){result.innerHTML='<p class="error">❌ '+esc(e.message||"خطای ناشناخته")+'</p>';}
  finally{btn.disabled=false;btn.textContent="ساخت حساب";}
}
document.getElementById("createUserBtn").onclick=createNewUser;

async function loadRoles(){
  const {data,error}=await supabaseClient.from("peyvand_user_roles").select("id,user_id,role,created_at").order("created_at",{ascending:true});
  if(error){document.getElementById("rolesTable").innerHTML='<p class="error">'+esc(error.message)+'</p>';return;}
  const {data:emps}=await supabaseClient.from("peyvand_employees").select("user_id,full_name,employee_number,email");
  const map=new Map((emps||[]).map(e=>[e.user_id,e]));
  let html='<table><tr><th>کاربر</th><th>پرسنلی</th><th>نقش</th><th>عملیات</th></tr>';
  for(const r of data||[]){
    const e=map.get(r.user_id)||{};
    const isOwner=r.role==="owner";
    html+='<tr><td>'+esc(e.full_name||"بدون مشخصات")+'</td><td>'+esc(e.employee_number||"")+'</td><td>'+
      '<select data-role="'+r.id+'" data-user="'+r.user_id+'" data-old="'+r.role+'" '+(isOwner?"disabled":"")+'>'+
      '<option value="owner" '+(r.role==="owner"?"selected":"")+' >Owner</option>'+
      '<option value="admin" '+(r.role==="admin"?"selected":"")+'>Admin</option>'+
      '<option value="user" '+(r.role==="user"?"selected":"")+'>User</option></select></td><td>'+
      (isOwner ? '<span class="muted">مالک سیستم</span>' : '<button data-save="'+r.id+'">ذخیره نقش</button>')+
      '</td></tr>';
  }
  html+='</table>'; document.getElementById("rolesTable").innerHTML=html;
  document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.save, s=document.querySelector('[data-role="'+id+'"]'), newRole=s.value, old=s.dataset.old;
    if(old==="owner"){s.value=old;return;}
    if(newRole==="owner"){
      alert("تغییر نقش به Owner از این بخش مجاز نیست؛ فقط یک Owner برای سیستم وجود دارد.");
      s.value=old;
      return;
    }
    const {error}=await supabaseClient.from("peyvand_user_roles").update({role:newRole}).eq("id",id).neq("role","owner");
    if(error) alert(error.message); else {alert("نقش ذخیره شد.");loadRoles();}
  });
}

(async()=>{
  try{
    const {user,role}=await getMyRole();
    if(role!=="owner"&&role!=="admin") throw new Error("دسترسی به پنل مدیریت ندارید.");
    document.getElementById("roleBadge").textContent=role==="owner"?"👑 Owner":"🛡️ Admin";
    statusBox.innerHTML='<span class="ok">دسترسی تأیید شد.</span>';
    usersPanel.classList.remove("hidden"); messagesPanel.classList.remove("hidden"); if(role==="owner") document.getElementById("addUserPanel").classList.remove("hidden");
    await loadUsers(role); await loadMessages();
    if(role==="owner"){ownerPanel.classList.remove("hidden"); auditPanel.classList.remove("hidden"); await loadRoles(); await loadAuditLogs();}
  }catch(e){showError(e.message||"خطا در بررسی دسترسی");}
})();

supabaseClient.auth.onAuthStateChange(function(event, session){
  if(event === "SIGNED_OUT" || !session){
    localStorage.removeItem("peyvand_name");
    localStorage.removeItem("peyvand_employee");
    localStorage.removeItem("peyvand_user_id");
    location.replace("index.html");
  }
});
</script>
</body>
</html>
