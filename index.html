<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پیوند | پیام‌رسان همکاران</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f6ed, #f8fbf9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #26372e;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 28px;
      padding: 38px 30px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(40, 100, 65, 0.13);
    }

    .logo {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      border-radius: 25px;
      background: #2f8f5b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(47,143,91,0.25);
    }

    h1 {
      color: #26784b;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #718078;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .input-group {
      text-align: right;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #405048;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      height: 53px;
      border: 1px solid #dce8e0;
      border-radius: 14px;
      padding: 0 16px;
      font-size: 15px;
      outline: none;
      background: #f9fcfa;
      direction: rtl;
      transition: 0.2s;
    }

    input:focus {
      border-color: #48a66d;
      background: white;
      box-shadow: 0 0 0 3px rgba(72,166,109,0.10);
    }

    button {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 15px;
      background: #2f8f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }

    button:hover {
      background: #26784b;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .security {
      margin-top: 24px;
      padding: 13px;
      border-radius: 13px;
      background: #f0f8f3;
      color: #64806e;
      font-size: 12px;
      line-height: 1.9;
    }

    .footer {
      margin-top: 22px;
      color: #9aa9a0;
      font-size: 11px;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      background: #fff1f1;
      color: #b44b4b;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">پ</div>

      <h1>پیوند</h1>

      <div class="subtitle">
        پیام‌رسان اختصاصی همکاران
      </div>

      <div class="input-group">
        <label for="name">نام و نام خانوادگی</label>

        <input
          id="name"
          type="text"
          placeholder="نام و نام خانوادگی"
          autocomplete="name">
      </div>

      <div class="input-group">
        <label for="employee">شماره پرسنلی</label>

        <input
          id="employee"
          type="text"
          placeholder="شماره پرسنلی"
          inputmode="numeric"
          autocomplete="off">
      </div>

      <button onclick="login()">
        ورود به پیوند
      </button>

      <div id="error" class="error">
        لطفاً نام و شماره پرسنلی را وارد کنید.
      </div>

      <div class="security">
        🔒 ورود با هویت سازمانی همکاران
        <br>
        ارتباطات داخلی و اختصاصی
      </div>

      <div class="footer">
        سامانه پیام‌رسان «پیوند»
      </div>

    </div>

  </div>


  <script>

    function login() {

      const name =
        document.getElementById("name").value.trim();

      const employee =
        document.getElementById("employee").value.trim();

      const error =
        document.getElementById("error");


      // بررسی ورود
      if (!name || !employee) {

        error.style.display = "block";

        return;
      }


      error.style.display = "none";


      // ذخیره مشخصات کاربر
      localStorage.setItem(
        "peyvand_name",
        name
      );

      localStorage.setItem(
        "peyvand_employee",
        employee
      );


      // ورود به محیط چت
      window.location.href = "chat.html";
    }


    // ورود با کلید Enter
    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          login();
        }

      }
    );

  </script>

</body>
</html>
