<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیوند | پیام‌رسان همکاران</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e8f6ed, #f8fbf9);
      color: #26372e;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 38px 30px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(40,100,65,.13);
    }

    .logo {
      width: 84px;
      height: 84px;
      margin: auto;
      margin-bottom: 18px;
      border-radius: 25px;
      background: #2f8f5b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      color: #26784b;
      font-size: 32px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #718078;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .input-group {
      text-align: right;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      height: 53px;
      border: 1px solid #dce8e0;
      border-radius: 14px;
      padding: 0 16px;
      font-size: 15px;
      outline: none;
      background: #f9fcfa;
    }

    input:focus {
      border-color: #48a66d;
      background: white;
    }

    button {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 15px;
      background: #2f8f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #26784b;
    }

    .security {
      margin-top: 24px;
      padding: 13px;
      border-radius: 13px;
      background: #f0f8f3;
      color: #64806e;
      font-size: 12px;
      line-height: 1.9;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      background: #fff1f1;
      color: #b44b4b;
      font-size: 12px;
    }

    .footer {
      margin-top: 22px;
      color: #9aa9a0;
      font-size: 11px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">پ</div>

    <h1>پیوند</h1>

    <div class="subtitle">
      پیام‌رسان اختصاصی همکاران
    </div>

    <div class="input-group">
      <label>نام و نام خانوادگی</label>

      <input
        id="name"
        type="text"
        placeholder="نام و نام خانوادگی">
    </div>

    <div class="input-group">
      <label>شماره پرسنلی</label>

      <input
        id="employee"
        type="text"
        inputmode="numeric"
        placeholder="شماره پرسنلی">
    </div>

    <button id="loginButton" type="button">
      ورود به پیوند
    </button>

    <div id="error" class="error">
      لطفاً نام و شماره پرسنلی را وارد کنید.
    </div>

    <div class="security">
      🔒 ورود با هویت سازمانی همکاران
      <br>
      ارتباطات داخلی و اختصاصی
    </div>

    <div class="footer">
      سامانه پیام‌رسان «پیوند»
    </div>

  </div>

</div>


<script>

  document
    .getElementById("loginButton")
    .addEventListener("click", function () {

      const name =
        document.getElementById("name").value.trim();

      const employee =
        document.getElementById("employee").value.trim();

      const error =
        document.getElementById("error");

      if (!name || !employee) {

        error.style.display = "block";

        return;
      }

      error.style.display = "none";

      localStorage.setItem(
        "peyvand_name",
        name
      );

      localStorage.setItem(
        "peyvand_employee",
        employee
      );

      // انتقال قطعی به صفحه چت
      window.location.assign(
        "https://almasonyz-design.github.io/peyvand-messenger/chat.html"
      );

    });

</script>

</body>
</html>
