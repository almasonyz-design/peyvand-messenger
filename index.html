    }

<body>

  <div class="login-box">

    <div class="logo">پیوند</div>

    <div class="subtitle">
      پیام‌رسان اختصاصی همکاران
    </div>

    <form id="loginForm">

      <label for="name">
        نام و نام خانوادگی
      </label>

      <input
        id="name"
        type="text"
        placeholder="مثلاً محمدحسین رافعی"
        required
      >

      <label for="employee">
        شماره پرسنلی
      </label>

      <input
        id="employee"
        type="text"
        placeholder="شماره پرسنلی"
        required
      >

      <label for="email">
        ایمیل
      </label>

      <input
        id="email"
        type="email"
        placeholder="ایمیل حساب کاربری"
        required
      >

      <label for="password">
        رمز عبور
      </label>

      <input
        id="password"
        type="password"
        placeholder="رمز عبور"
        required
      >

      <button
        id="loginButton"
        type="submit"
      >
        ورود به پیوند
      </button>

      <div
        id="errorBox"
        class="error"
      ></div>

    </form>

    <div class="info">
      حساب کاربری توسط مدیر سامانه ایجاد می‌شود.
    </div>

  </div>


<script>

  // ==============================
  // Supabase
  // ==============================

  const SUPABASE_URL =
    "https://ydgfjupryhuiyriaxvin.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable__hlPVmThO6PDb-_LSvMzWw_uAeHKMxs";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==============================
  // عناصر صفحه
  // ==============================

  const form =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const errorBox =
    document.getElementById("errorBox");


  function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";
  }


  // ==============================
  // ورود
  // ==============================

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      errorBox.style.display = "none";

      const name =
        document
          .getElementById("name")
          .value
          .trim();

      const employee =
        document
          .getElementById("employee")
          .value
          .trim();

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      if (!name || !employee || !email || !password) {

        showError(
          "لطفاً همه اطلاعات را وارد کنید."
        );

        return;
      }


      loginButton.disabled = true;

      loginButton.textContent =
        "در حال ورود...";


      // ورود واقعی به Supabase Auth

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        console.error(error);

        showError(
          "ورود ناموفق بود. ایمیل یا رمز عبور صحیح نیست."
        );

        loginButton.disabled = false;

        loginButton.textContent =
          "ورود به پیوند";

        return;
      }


      // ذخیره اطلاعات نمایشی کاربر

      localStorage.setItem(
        "peyvand_name",
        name
      );

      localStorage.setItem(
        "peyvand_employee",
        employee
      );


      // ذخیره شناسه واقعی کاربر

      localStorage.setItem(
        "peyvand_user_id",
        data.user.id
      );


      // ورود موفق

      window.location.href =
        "https://almasonyz-design.github.io/peyvand-messenger/chat.html";

    }
  );

</script>

</body>
</html>
