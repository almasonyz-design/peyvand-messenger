```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پیوند | ورود همکاران</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, Arial, sans-serif;
      background: #eef8f2;
      color: #173b2b;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      color: #198754;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #667;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cfe2d7;
      border-radius: 12px;
      margin-bottom: 18px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #198754;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #198754;
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #157347;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fff1f0;
      color: #b42318;
      font-size: 13px;
      line-height: 1.8;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #e8f7ee;
      color: #16794c;
      font-size: 13px;
      line-height: 1.8;
    }

    .info {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #899;
      line-height: 1.8;
    }
  </style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    پیوند
  </div>

  <div class="subtitle">
    پیام‌رسان اختصاصی همکاران
  </div>

  <form id="loginForm">

    <label for="name">
      نام و نام خانوادگی
    </label>

    <input
      id="name"
      type="text"
      placeholder="نام و نام خانوادگی"
      required
    >

    <label for="employee">
      شماره پرسنلی
    </label>

    <input
      id="employee"
      type="text"
      placeholder="شماره پرسنلی"
      required
    >

    <label for="email">
      ایمیل
    </label>

    <input
      id="email"
      type="email"
      placeholder="ایمیل حساب کاربری"
      required
    >

    <label for="password">
      رمز عبور
    </label>

    <input
      id="password"
      type="password"
      placeholder="رمز عبور"
      required
    >

    <button
      id="loginButton"
      type="submit"
    >
      ورود به پیوند
    </button>

    <div
      id="errorBox"
      class="error"
    ></div>

    <div
      id="successBox"
      class="success"
    ></div>

  </form>

  <div class="info">
    دسترسی فقط برای همکاران ثبت‌شده امکان‌پذیر است.
  </div>

</div>


<script>

  // =====================================
  // Supabase
  // =====================================

  const SUPABASE_URL =
    "https://ydgfjupryhuiyriaxvin.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable__hlPVmThO6PDb-_LSvMzWw_uAeHKMxs";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // اگر قبلاً وارد شده، از صفحه ورود عبور کن
  (async function () {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      window.location.href = "chat.html";
      return;
    }
    localStorage.removeItem("peyvand_name");
    localStorage.removeItem("peyvand_employee");
    localStorage.removeItem("peyvand_user_id");
  })();

  // =====================================
  // عناصر صفحه
  // =====================================

  const form =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const errorBox =
    document.getElementById("errorBox");

  const successBox =
    document.getElementById("successBox");


  function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";

    successBox.style.display = "none";
  }


  function showSuccess(message) {

    successBox.textContent = message;

    successBox.style.display = "block";

    errorBox.style.display = "none";
  }


  // =====================================
  // ورود
  // =====================================

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      errorBox.style.display = "none";

      successBox.style.display = "none";


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const employee =
        document
          .getElementById("employee")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("password")
          .value;


      if (
        !name ||
        !employee ||
        !email ||
        !password
      ) {

        showError(
          "لطفاً همه اطلاعات را وارد کنید."
        );

        return;
      }


      loginButton.disabled = true;

      loginButton.textContent =
        "در حال بررسی...";


      // =====================================
      // 1. ورود واقعی Supabase
      // =====================================

      const {
        data: authData,
        error: authError
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email: email,

            password: password

          });


      if (authError) {

        console.error(authError);

        showError(
          "ایمیل یا رمز عبور صحیح نیست."
        );

        loginButton.disabled = false;

        loginButton.textContent =
          "ورود به پیوند";

        return;
      }


      // =====================================
      // 2. بررسی کاربر در لیست همکاران
      // =====================================

      const {
        data: employeeData,
        error: employeeError
      } =
        await supabaseClient
          .from("peyvand_employees")
          .select(
            "id, user_id, full_name, employee_number, email, is_active"
          )
          .eq(
            "user_id",
            authData.user.id
          )
          .eq(
            "employee_number",
            employee
          )
          .eq(
            "email",
            email
          )
          .eq(
            "is_active",
            true
          )
          .maybeSingle();


      if (employeeError) {

        console.error(employeeError);

        await supabaseClient.auth.signOut();

        showError(
          "خطا در بررسی دسترسی همکار."
        );

        loginButton.disabled = false;

        loginButton.textContent =
          "ورود به پیوند";

        return;
      }


      if (!employeeData) {

        await supabaseClient.auth.signOut();

        showError(
          "این حساب یا شماره پرسنلی در فهرست همکاران ثبت نشده است."
        );

        loginButton.disabled = false;

        loginButton.textContent =
          "ورود به پیوند";

        return;
      }


      // =====================================
      // 3. بررسی نام
      // =====================================

      if (
        employeeData.full_name &&
        employeeData.full_name !== "کاربر آزمایشی" &&
        employeeData.full_name.trim() !== name.trim()
      ) {

        await supabaseClient.auth.signOut();

        showError(
          "نام و نام خانوادگی با اطلاعات ثبت‌شده مطابقت ندارد."
        );

        loginButton.disabled = false;

        loginButton.textContent =
          "ورود به پیوند";

        return;
      }


      // =====================================
      // 4. ذخیره اطلاعات کاربر
      // =====================================

      localStorage.setItem(
        "peyvand_name",
        employeeData.full_name || name
      );


      localStorage.setItem(
        "peyvand_employee",
        employeeData.employee_number
      );


      localStorage.setItem(
        "peyvand_user_id",
        authData.user.id
      );


      // =====================================
      // 5. ورود به چت
      // =====================================

      showSuccess(
        "ورود موفق بود؛ در حال ورود به پیوند..."
      );


      setTimeout(
        function() {

          window.location.href =
            "https://almasonyz-design.github.io/peyvand-messenger/chat.html";

        },
        500
      );

    }
  );

</script>

</body>
</html>
```
